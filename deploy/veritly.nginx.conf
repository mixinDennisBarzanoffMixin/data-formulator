server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self' https://app.veritly.co.uk http://opencode-frontend.veritly.svc.cluster.local http://localhost:* http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
  add_header X-Content-Type-Options nosniff always;

  location = /livez { return 200 'ok'; }
  location = /readyz { return 200 'ok'; }
  location / { try_files $uri $uri/ /veritly.html; }
}
